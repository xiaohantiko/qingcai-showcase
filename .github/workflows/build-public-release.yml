name: Build and publish verified installers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-package-release
  cancel-in-progress: true

jobs:
  macos:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build, unpack, and launch the macOS package
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/packages"
          scratch=$(mktemp -d)
          extracted="$scratch/extracted"
          mounted=""
          smoke_pid=""
          cleanup() {
            if [[ -n "$smoke_pid" ]]; then
              kill "$smoke_pid" 2>/dev/null || true
              wait "$smoke_pid" 2>/dev/null || true
            fi
            if [[ -n "$mounted" ]]; then
              hdiutil detach "$mounted" -quiet || true
            fi
            rm -rf "$scratch"
          }
          trap cleanup EXIT
          check_architectures() {
            executable_path=$1
            shift
            available=$(lipo -archs "$executable_path")
            for architecture in "$@"; do
              case " $available " in
                *" $architecture "*) ;;
                *) echo "Expected $architecture in $available" >&2; return 1 ;;
              esac
            done
          }
          smoke_start() {
            "$@" > "$scratch/smoke.log" 2>&1 &
            smoke_pid=$!
            sleep 5
            if ! kill -0 "$smoke_pid"; then
              cat "$scratch/smoke.log" >&2
              echo 'The packaged app exited during startup.' >&2
              return 1
            fi
            kill "$smoke_pid"
            wait "$smoke_pid" 2>/dev/null || true
            smoke_pid=""
          }
          mkdir -p "$output" "$extracted"
          swift run --build-system native QingcaiChecks
          bash scripts/build-app.sh
          asset=Qingcai-macOS-arm64.zip
          ditto -c -k --norsrc --noextattr --keepParent 'dist/清财.app' "$output/$asset"
          unzip -tq "$output/$asset"
          ditto -x -k "$output/$asset" "$extracted"
          app="$extracted/清财.app"
          codesign --verify --deep --strict "$app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Contents/Info.plist")
          check_architectures "$app/Contents/MacOS/$executable" arm64
          smoke_start "$app/Contents/MacOS/$executable" --demo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-macos
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: macos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: packages
      - name: Publish a release for this source snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo 'A newer source snapshot is already queued.'
            exit 0
          fi
          cd packages
          shopt -s nullglob
          files=(*.zip *.dmg)
          test "${#files[@]}" -eq 1
          sha256sum "${files[@]}" > SHA256SUMS.txt
          tag="public-${GITHUB_SHA:0:12}"
          notes='此版本由当前公开源码构建。macOS 应用使用临时签名，尚未通过 Apple 公证。请核对 SHA256SUMS.txt。'
          if draft=$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" == true ]]; then
              gh release upload "$tag" "${files[@]}" SHA256SUMS.txt --clobber -R "$GITHUB_REPOSITORY"
              gh release edit "$tag" --draft=false --latest -R "$GITHUB_REPOSITORY"
            fi
          else
            gh release create "$tag" "${files[@]}" SHA256SUMS.txt --target "$GITHUB_SHA" \
              --title "清财 · $tag" --notes "$notes" --latest -R "$GITHUB_REPOSITORY"
          fi
